# Merge these rows with your existing Herdr config. Do not replace the whole file.
# If rows_by_agent overrides exist, add the gh tokens to those layouts too.
# On Herdr 0.8.2, use plain token strings instead of style tables.
# Recommended: add this entry to your existing [ui].tab_bar_right array, using
# the installed plugin path. This keeps idle status alive even without focus hooks:
# { type = "command", command = "'/absolute/path/herdr-plugin-gh/bin/herdr-plugin-gh' refresh --cached --silent", interval_seconds = 60, timeout_seconds = 120 }
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
  ["$gh_pr", "$gh_review"],
  [{ token = "$gh_failed", fg = "#ff6b6b" }, { token = "$gh_pending", fg = "#c4b28a" }, { token = "$gh_passed", fg = "#8a9a7b" }, { token = "$gh_canceled", fg = "#c0c0c0" }, { token = "$gh_skipped", fg = "#c0c0c0" }, { token = "$gh_unknown", fg = "#c0c0c0" }],
]

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "gh.menu"
description = "GitHub - open menu"

[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "gh.open"
description = "GitHub - open or create PR"

[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "gh.refresh"
description = "GitHub - Force refresh"

[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "gh.open-checks"
description = "GitHub - View Checks"

[[keys.command]]
key = "prefix+alt+s"
type = "plugin_action"
command = "gh.copy-slack"
description = "GitHub - copy PR for Slack"

# Markdown Mode is toggled with Space while Copy PR for Slack is selected in the popup.
# It is saved in settings.json
# under `herdr plugin config-dir gh`, not in this main Herdr config file.
